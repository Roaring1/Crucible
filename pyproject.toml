[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
dynamic = ["version"]
description = "Minecraft Server Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.5"]

[project.scripts]
crucible = "crucible.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crucible*"]

[tool.setuptools.package-data]
crucible = [
    "assets/*.png",
    "data/*.json",
    "ui/assets/server-icons/*.svg",
    "ui/assets/status-icons/*.svg",
    "ui/assets/menu-icons/*.svg",
]

[tool.setuptools.dynamic]
version = {attr = "crucible.__version__"}
