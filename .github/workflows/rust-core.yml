name: Rust core

on:
  push:
    branches: [main]
    paths:
      - "rust/crucible-core/**"
      - "tests/test_rust_pack_version_fixtures.py"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "rust/crucible-core/**"
      - "tests/test_rust_pack_version_fixtures.py"
      - ".github/workflows/rust-core.yml"

permissions:
  contents: read

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install stable Rust with formatting and lint components
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust/crucible-core/Cargo.toml -- --check
      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/crucible-core/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path rust/crucible-core/Cargo.toml --locked --all-targets -- -D warnings
